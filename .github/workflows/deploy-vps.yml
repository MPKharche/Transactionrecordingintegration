name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (for scripts reference)
        uses: actions/checkout@v4

      - name: Verify production secrets
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::VPS_HOST is not set. GitHub → Settings → Environments → production → Add secret VPS_HOST (e.g. 195.35.6.159 or practice.planetfinance.cloud)"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::VPS_USER is not set (usually root)"
            missing=1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::VPS_SSH_KEY is not set. Paste the full OpenSSH private key for the deploy key"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/GITHUB-DEPLOY-SECRETS.md"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            REPO="${{ secrets.VPS_REPO_DIR || '/root/apps/ca-saas' }}"
            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main
            export VPS_REPO_DIR="$REPO"
            export VPS_HEALTH_URL="${{ secrets.VPS_HEALTH_URL || 'https://practice.planetfinance.cloud/api/health' }}"
            bash scripts/vps-remote-update.sh

      - name: Summary
        run: |
          echo "VPS deploy finished. UI: https://ca-suite-web.vercel.app"
          echo "API: https://practice.planetfinance.cloud/api/health"
