# Host nginx — practice.planetfinance.cloud → CA Suite (Docker nginx on 127.0.0.1:3080)
# Install: cp to /etc/nginx/sites-available/practice && ln -sf .../practice /etc/nginx/sites-enabled/practice
# TLS cert already issued: /etc/letsencrypt/live/practice.planetfinance.cloud/

server {
    listen 80;
    listen [::]:80;
    server_name practice.planetfinance.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name practice.planetfinance.cloud;

    ssl_certificate /etc/letsencrypt/live/practice.planetfinance.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/practice.planetfinance.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
