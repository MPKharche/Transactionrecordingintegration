# practice.planetfinance.cloud — API host only (Vercel = sole frontend)
# UI: https://ca-suite-web.vercel.app  |  API: https://practice.planetfinance.cloud/api/*
#
# Install: sudo cp deploy/nginx-practice.planetfinance.cloud.conf /etc/nginx/sites-available/practice
#          sudo ln -sf /etc/nginx/sites-available/practice /etc/nginx/sites-enabled/practice
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name practice.planetfinance.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name practice.planetfinance.cloud;

    ssl_certificate /etc/letsencrypt/live/practice.planetfinance.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/practice.planetfinance.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # API + OAuth (Docker Fastify on 127.0.0.1:4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # No SPA on VPS — send users to Vercel
    location / {
        return 301 https://ca-suite-web.vercel.app$request_uri;
    }
}
