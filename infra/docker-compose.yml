version: "3.9"

# Default limits target ≤~1.5 GB RAM peak (constrained VPS). Override via .env — see .env.production.example

networks:
  ca-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 220m
    cpus: "0.25"
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=48MB
      - -c
      - work_mem=2MB
    environment:
      POSTGRES_DB: ca_saas
      POSTGRES_USER: ca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ca_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [ca-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca_user -d ca_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.10"
    command: redis-server --save "" --appendonly no --maxmemory 48mb --maxmemory-policy allkeys-lru --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [ca-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 220m
    cpus: "0.20"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [ca-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  extractor:
    build:
      context: ../services/extractor
    image: ca-saas-extractor:latest
    restart: unless-stopped
    mem_limit: 400m
    cpus: "0.45"
    env_file:
      - ../.env
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v3.2}
      OPENROUTER_MODEL_FALLBACK: ${OPENROUTER_MODEL_FALLBACK:-google/gemini-2.5-flash-lite}
      EXTRACT_USE_OPENROUTER_ONLY: ${EXTRACT_USE_OPENROUTER_ONLY:-true}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://cc-vibe.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      USE_CLAUDE_VALIDATION: ${USE_CLAUDE_VALIDATION:-true}
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      EXTRACTOR_WORKERS: ${EXTRACTOR_WORKERS:-1}
      EXTRACT_MAX_CONCURRENT: ${EXTRACT_MAX_CONCURRENT:-1}
    networks: [ca-internal]
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ca-suite-api:latest
    restart: unless-stopped
    mem_limit: 140m
    cpus: "0.25"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DEPLOY_PROFILE: ${DEPLOY_PROFILE:-constrained}
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      API_PORT: "4000"
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-at-least-32-characters-long}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOW_AUTO_JOIN: ${GOOGLE_ALLOW_AUTO_JOIN:-false}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      OPENROUTER_MODEL_FALLBACK: ${OPENROUTER_MODEL_FALLBACK:-google/gemini-2.5-flash-lite}
      EXTRACT_USE_OPENROUTER_ONLY: ${EXTRACT_USE_OPENROUTER_ONLY:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      PIPELINE_MAX_QUEUE_DEPTH: ${PIPELINE_MAX_QUEUE_DEPTH:-40}
      PIPELINE_JOB_ATTEMPTS: ${PIPELINE_JOB_ATTEMPTS:-3}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      EXTRACTOR_TIMEOUT_MS: ${EXTRACTOR_TIMEOUT_MS:-120000}
      EXTRACTOR_URL: http://extractor:8000
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-6}
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ALLOW_DEV_LOGIN: ${VITE_ALLOW_DEV_LOGIN:-false}
        VITE_API_URL: /api
    image: ca-saas-web:latest
    restart: unless-stopped
    mem_limit: 48m
    cpus: "0.05"
    networks: [ca-internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: ca-saas-worker:latest
    restart: unless-stopped
    mem_limit: 320m
    cpus: "0.45"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DEPLOY_PROFILE: ${DEPLOY_PROFILE:-constrained}
      WORKER_DEFER_IMAGE_OCR: ${WORKER_DEFER_IMAGE_OCR:-true}
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      EXTRACTOR_URL: http://extractor:8000
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v3.2}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
      EXTRACT_LLM_CONCURRENCY: ${EXTRACT_LLM_CONCURRENCY:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-6}
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      extractor:
        condition: service_healthy

  db-migrate:
    build:
      context: ../packages/db
      dockerfile: Dockerfile
    image: ca-saas-db-migrate:latest
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    image: ca-saas-bot:latest
    restart: unless-stopped
    profiles: ["bot"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 48m
    cpus: "0.10"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [ca-internal]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
