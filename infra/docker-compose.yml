version: "3.9"

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  ca-internal:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  # ─── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ca_saas
      POSTGRES_USER: ca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ca_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [ca-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca_user -d ca_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [ca-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # MinIO S3 API
      - "9001:9001"   # MinIO console (dev only)
    networks: [ca-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Extractor ─────────────────────────────────────────────────────────────
  extractor:
    build:
      context: ../services/extractor
    image: ca-saas-extractor:latest
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.75"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── REST API (Fastify) ────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ca-suite-api:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      API_PORT: "4000"
      AUTH_DEV_BYPASS: "true"
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Web (Next.js) ─────────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ca-saas-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      EXTRACTOR_URL: http://extractor:8000
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production-32chars}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NODE_ENV: production
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      extractor:
        condition: service_healthy

  # ─── Worker (BullMQ) ───────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: ca-saas-worker:latest
    restart: unless-stopped
    mem_limit: 1g
    environment:
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      EXTRACTOR_URL: http://extractor:8000
      EXTRACTOR_SHARED_SECRET: ${EXTRACTOR_SHARED_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      extractor:
        condition: service_healthy

  # ─── Bot (Telegraf long-polling — dev) or use webhook in web for prod ──────
  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    image: ca-saas-bot:latest
    restart: unless-stopped
    profiles: ["bot"]  # opt-in: docker compose --profile bot up
    environment:
      DATABASE_URL: postgresql://ca_user:${POSTGRES_PASSWORD:-ca_pass}@postgres:5432/ca_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ca-uploads}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    networks: [ca-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [ca-internal]
    depends_on: [web]
