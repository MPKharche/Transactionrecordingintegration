# VPS overlay: API-only host (Vercel serves UI). No Docker nginx/web on :3080.
# Usage: docker compose -f docker-compose.yml -f docker-compose.vps.yml --env-file ../.env ...

services:
  postgres:
    ports: !override
      - "127.0.0.1:5434:5432"

  redis:
    ports: !override []

  api:
    ports: !override
      - "127.0.0.1:4000:4000"

  # SPA runs on Vercel only — do not start on VPS
  web:
    profiles: ["docker-spa"]

  nginx:
    profiles: ["docker-spa"]
